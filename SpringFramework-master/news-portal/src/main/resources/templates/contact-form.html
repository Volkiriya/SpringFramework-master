<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Контакт</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="mb-4 d-flex align-items-center">
        <a class="btn btn-link me-3" th:href="@{/contacts}">&larr; Назад к списку</a>
        <h1 class="h4 mb-0" th:text="${formTitle}">Контакт</h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${contact.id} == null ? @{/contacts} : @{/contacts/{id}(id=${contact.id})}" method="post" th:object="${contact}">
                <input type="hidden" th:if="${contact.id != null}" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label" for="firstName">Имя</label>
                    <input class="form-control" id="firstName" type="text" th:field="*{firstName}" placeholder="Иван" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="lastName">Фамилия</label>
                    <input class="form-control" id="lastName" type="text" th:field="*{lastName}" placeholder="Иванов" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" th:field="*{email}" placeholder="user@example.com" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="phone">Телефон</label>
                    <input class="form-control" id="phone" type="text" th:field="*{phone}" placeholder="+7 (000) 000-00-00" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="d-flex justify-content-end">
                    <button class="btn btn-secondary me-2" type="button" th:onclick="|window.location='@{/contacts}'|">Отмена</button>
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
